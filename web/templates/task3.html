{% extends "base.html" %}
{% block title %}Task 3 | Knight's Tour{% endblock %}
{% block content %}
<header class="page-heading">
  <p class="eyebrow">Task 3</p>
  <h1>Knight's Tour</h1>
  <p>Enter the board size and knight position, view the board, then solve.</p>
</header>
<section class="tour-layout">
  <form id="tour-form" class="tour-form">
    <div class="form-grid">
      <label for="tour-cols">Columns
        <input id="tour-cols" name="cols" type="number" required step="1">
      </label>
      <label for="tour-rows">Rows
        <input id="tour-rows" name="rows" type="number" required step="1">
      </label>
      <label for="tour-start-col">Knight column (x)
        <input id="tour-start-col" name="start_col" type="number" required step="1">
      </label>
      <label for="tour-start-row">Knight row (y)
        <input id="tour-start-row" name="start_row" type="number" required step="1">
      </label>
    </div>
    <p class="field-hint">0 is the first column; row 0 is the top row.</p>
    <div class="form-buttons">
      <button id="generate-board" type="submit">Generate board</button>
      <button id="reset-tour" type="button">Reset</button>
    </div>
  </form>
  <div id="tour-error" class="tour-error" role="alert" hidden></div>
  <div id="board-container" class="board-container" hidden>
    <div id="board-area" class="board-area">
      <div class="rank-column" aria-hidden="true">
        <div id="row-labels" class="row-labels"></div>
      </div>
      <div id="board" class="board" role="grid"></div>
      <div id="col-labels" class="col-labels" aria-hidden="true"></div>
    </div>
    <div class="tour-actions">
      <button id="solve-tour" type="button" hidden>Solve</button>
    </div>
  </div>
  <section id="tour-panel" class="panel" aria-live="polite">
    <h2>Tour summary</h2>
    <p id="tour-status"></p>
    <p id="tour-time"></p>
    <ol id="tour-order"></ol>
  </section>
</section>
{% endblock %}
